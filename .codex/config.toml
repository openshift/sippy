[mcp_servers.playwright]
command = "sh"
args = ["-c", "npx @playwright/mcp@0.0.84 --viewport-size 1440,900 ${CHROME_PATH:+--executable-path \"$CHROME_PATH\"}"]

[mcp_servers.playwright.env]

[mcp_servers.sippy-dev]
command = "sh"
args = ["-c", "exec \"$(git rev-parse --show-toplevel)/mcp/run.sh\""]
startup_timeout_sec = 300
tool_timeout_sec = 14400

[mcp_servers.sippy-dev.env]

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v1/mcp"
